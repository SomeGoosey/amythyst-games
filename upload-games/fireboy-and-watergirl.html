<script>
/* The original ad SDK (h5branding) is gone. The game JS bundles the same
   module as requirejs AMD, so bridge it to window and let its own splash
   logic start the game in game-zone mode (no ads). */
(function () {
  function attempt(n) {
    if (n > 80) return;
    try {
      window.require(['h5branding'], function (h) {
        window.h5branding = h;
        var i = h.SplashLoader.getInstance();
        i.setLoadProgress = function (a) {
          if (a >= 100 && this.buttonCallback) this.onPlayButtonClick();
        };
      }, function () { setTimeout(function () { attempt(n + 1); }, 250); });
    } catch (e) { setTimeout(function () { attempt(n + 1); }, 250); }
  }
  setTimeout(function () { attempt(0); }, 800);
})();
</script>
</head>

window.require = undefined;
</script>

  if (typeof callback === 'function') s.onload = callback;
