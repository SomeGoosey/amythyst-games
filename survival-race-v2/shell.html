<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Survival Race</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;border:0!important;border-radius:0!important;box-shadow:none!important}
canvas{width:100%;height:100%;display:block;border:0!important;border-radius:0!important;box-shadow:none!important;outline:0!important}
#loading{position:fixed;top:50%;left:0;width:100%;text-align:center;color:white;font:18px Arial;z-index:9}
</style>
<script src="https://cdn.jsdelivr.net/gh/SomeGoosey/amythyst-games@v1.0.71/survival-race-v2/min.js"></script>
</head>
<body>
<canvas id="unity-canvas"></canvas>
<div id="loading">Loading</div>
<script>
var ysdk={features:{LoadingAPI:{ready:function(){}}}};
var myGameInstance=null;
var playerData=JSON.stringify({playerAuth:'rejected',playerName:'unauthorized',playerId:'unauthorized',playerPhoto:'null'});
var environmentData=JSON.stringify({language:'en'});
var cloudSaves=localStorage.getItem('survival-race-save')||'noData';
try{var storedSaves=JSON.parse(cloudSaves);if(!Array.isArray(storedSaves))cloudSaves=JSON.stringify([cloudSaves]);}catch(error){cloudSaves='noData';}
function sendGame(method,value){if(myGameInstance)myGameInstance.SendMessage('YandexGame',method,value||'');else setTimeout(function(){sendGame(method,value)},100)}
function InitGame(){sendGame('SetInitializationSDK',playerData)}
function InitPlayer(){InitGame()}
function InitSDK(){InitGame()}
function GameReadyAPI(){}
function LanguageRequest(){sendGame('SetLanguage','en')}
function RequestingEnvironmentData(){sendGame('SetEnvironmentData',environmentData)}
function SaveCloud(data){cloudSaves=JSON.stringify([data]);localStorage.setItem('survival-race-save',cloudSaves)}
function LoadCloud(){sendGame('SetLoadSaves',cloudSaves)}
function FullAdShow(){sendGame('CloseFullAd','false')}
function RewardedShow(){sendGame('CloseVideo')}
function StickyAdActivity(){}
function StaticRBTDeactivate(){}
function InitLeaderboard(){}
function SetLeaderboardScores(){}
function GetLeaderboardScores(){}
function Review(){sendGame('ReviewSent','false')}
function PromptShow(){sendGame('OnPromptFail')}
function InitPayments(){}
function GetPayments(){}
function BuyPayments(){}
function ConsumePurchase(){}
function ConsumePurchases(){}
function OpenAuthDialog(){InitGame()}
function PaintRBT(){}
createUnityInstance(document.getElementById("unity-canvas"),{
 dataUrl:"https://cdn.jsdelivr.net/gh/SomeGoosey/amythyst-games@v1.0.71/survival-race-v2/cardata.js",
 frameworkUrl:"https://cdn.jsdelivr.net/gh/SomeGoosey/amythyst-games@v1.0.71/survival-race-v2/carframework.js",
 codeUrl:"https://cdn.jsdelivr.net/gh/SomeGoosey/amythyst-games@v1.0.71/survival-race-v2/carwasm.js",
 streamingAssetsUrl:"https://cdn.jsdelivr.net/gh/SomeGoosey/amythyst-games@v1.0.71/survival-race-v2/StreamingAssets",
 companyName:"Survival Race",productName:"Survival Race",productVersion:"1.0"
},function(progress){document.getElementById("loading").textContent="Loading "+Math.round(progress*100)+"%";})
.then(function(instance){window.gameInstance=instance;myGameInstance=instance;document.getElementById("loading").remove();})
.catch(function(error){document.getElementById("loading").textContent=String(error);});
</script>
</body>
</html>
