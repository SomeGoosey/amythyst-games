<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape Road 3</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #101018; color: #dfe; overflow: hidden; font: 14px system-ui, sans-serif; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; }
  #frame { display: none; border: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
  <div id="status">Loading Escape Road 3&hellip;</div>
  <script>
    // Escape Road 3 is 59.5 MB uncompressed — over jsDelivr's 20 MB limit.
    // The game was gzip-compressed (45.3 MB) and split into 4 base64
    // chunks (escape-road-3-gz-parts/part-0..3, each ~15 MB). This
    // wrapper fetches all four, base64-decodes, concatenates, inflates
    // with DecompressionStream('gzip'), and displays the game in an
    // iframe via srcdoc. Zero round-trips, no server.
    var BASE = 'https://cdn.jsdelivr.net/gh/SomeGoosey/amythyst-games@main/';
    var PARTS = 4;
    async function load() {
      try {
        var b64 = '';
        for (var i = 0; i < PARTS; i++) {
          var r = await fetch(BASE + 'escape-road-3-gz-parts/part-' + i);
          if (!r.ok) throw new Error('part ' + i + ' http ' + r.status);
          b64 += await r.text();
        }
        var bin = atob(b64);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        var ds = new DecompressionStream('gzip');
        var stream = new Blob([bytes]).stream().pipeThrough(ds);
        var text = await new Response(stream).text();
        var f = document.getElementById('frame');
        f.srcdoc = text;
        f.style.display = 'block';
        document.getElementById('status').style.display = 'none';
      } catch (e) {
        document.getElementById('status').textContent = 'Error: ' + (e && e.message || e);
      }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', load); else load();
  </script>
  <iframe id="frame" title="Escape Road 3" allow="fullscreen; gamepad; pointer-lock"></iframe>
</body>
</html>
