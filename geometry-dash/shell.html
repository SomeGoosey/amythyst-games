    <meta

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        outline: none;
        touch-action: none;
        user-select: none;
      }
      #loading-text {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999999;
        font-size: 48px;
        font-family: cursive;
        font-weight: bold;
        pointer-events: none;
        white-space: nowrap;
        background: linear-gradient(
          270deg,
          #ff0000,
          #ff7f00,
          #ffff00,
          #00ff00,
          #0000ff,
          #4b0082,
          #8f00ff
        );
        background-size: 400% 400%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: rainbow 3s ease infinite;
      }
      @keyframes rainbow {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
    </style>
    <style>
      #loading-text {
        position: fixed; inset: 0; z-index: 999999; display: flex; flex-direction: column; transform: none; top: 0; left: 0; right: 0; bottom: 0;
        align-items: center; justify-content: center; gap: 18px; overflow: hidden;
        background: radial-gradient(ellipse at 50% 35%, #23262e 0%, #0b0c10 75%);
        font-family: "Arial Black", Impact, system-ui, sans-serif; pointer-events: none;
      }
      #loading-text .gd-grid {
        position: absolute; inset: -10%; opacity: .09; pointer-events: none;
        background-image: linear-gradient(#7fd6ff 2px, transparent 2px), linear-gradient(90deg, #7fd6ff 2px, transparent 2px);
        background-size: 56px 56px; transform: perspective(500px) rotateX(35deg) scale(1.4);
      }
      #loading-text .gd-title {
        font-size: clamp(34px, 6vw, 78px); font-weight: 900; letter-spacing: 4px; line-height: 1;
        background: linear-gradient(180deg, #fff7b0 0%, #ffd23f 38%, #ff9a00 70%, #c25b00 100%);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        -webkit-text-stroke: 3px #1a1005; filter: drop-shadow(0 5px 0 #7a3a00) drop-shadow(0 10px 22px rgba(255,150,0,.35));
        text-align: center; padding: 6px 12px;
      }
      #loading-text .gd-sub {
        color: #ffe27a; font-size: 18px; letter-spacing: 10px; font-weight: 900;
        -webkit-text-stroke: 1px #000; text-shadow: 0 2px 0 #7a3a00; margin-top: -6px;
      }
      #loading-text .gd-bar-frame {
        width: min(620px, 82vw); height: 38px; box-sizing: border-box; padding: 5px;
        background: linear-gradient(#3a3a3a, #141414); border: 4px solid #0a0a0a; border-radius: 8px;
        box-shadow: inset 0 2px 6px #000, 0 0 0 2px #5a5a5a, 0 8px 26px rgba(0,0,0,.7); overflow: hidden;
      }
      #loading-text .gd-bar {
        width: 0%; height: 100%; border-radius: 3px; position: relative; overflow: hidden;
        background: linear-gradient(180deg, #ffe98a 0%, #ffc22e 45%, #ff8a00 100%);
        box-shadow: 0 0 16px rgba(255,180,0,.75), inset 0 2px 2px rgba(255,255,255,.7);
        transition: width .12s linear;
      }
      #loading-text .gd-bar-stripes {
        position: absolute; inset: 0;
        background: repeating-linear-gradient(45deg, rgba(255,255,255,.35) 0 16px, rgba(255,255,255,0) 16px 32px);
        animation: gd-stripes .55s linear infinite;
      }
      @keyframes gd-stripes { from { background-position: 0 0; } to { background-position: 45px 0; } }
      #loading-text .gd-stats {
        width: min(620px, 82vw); display: flex; justify-content: space-between;
        color: #fff3cf; -webkit-text-fill-color: #fff3cf; font-size: 16px; font-weight: 800; letter-spacing: 1px;
        text-shadow: 0 2px 3px #000, 0 0 12px rgba(255,170,0,.5);
      }
    </style>
  </head>
