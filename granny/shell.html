<!DOCTYPE html>
<html lang="en-us">
<head>
<base href="https://cdn.jsdelivr.net/gh/SomeGoosey/amythyst-games@v1.0.72/granny/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Granny</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;border:0!important;border-radius:0!important;box-shadow:none!important}
#unityContainer{position:fixed;inset:0;width:100vw;height:100vh;border:0!important;border-radius:0!important;box-shadow:none!important}
#unityContainer canvas{display:block;width:100vw!important;height:100vh!important;border:0!important;border-radius:0!important;box-shadow:none!important;outline:0!important}
#loading-text{
  position:fixed;inset:0;z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  overflow:hidden;pointer-events:none;
  background:radial-gradient(ellipse at 50% 35%,#2a0f18 0%,#0a0407 72%),linear-gradient(#120409,#050204);
  font-family:"Arial Black",Impact,system-ui,sans-serif;
}
#loading-text:after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
.glow{position:absolute;width:70vmin;height:70vmin;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(190,20,40,.24),transparent 65%);animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.92);opacity:.65}50%{transform:scale(1.08);opacity:1}}
.gtitle{
  position:relative;z-index:1;margin:0 0 6px;font-size:clamp(46px,10vw,120px);font-weight:900;letter-spacing:10px;line-height:1.1;text-align:center;
  background:linear-gradient(180deg,#fff 0%,#ffd9d9 35%,#ff5a5a 70%,#8b0000 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  -webkit-text-stroke:3px #2b0000;
  filter:drop-shadow(0 6px 0 #5c0000) drop-shadow(0 12px 30px rgba(255,40,40,.45));
  animation:flicker 4s infinite;
}
@keyframes flicker{0%,97%,100%{opacity:1}97.5%{opacity:.55}98%{opacity:1}98.5%{opacity:.7}99%{opacity:1}}
.gsub{position:relative;z-index:1;color:#ff8a8a;font-size:clamp(12px,2vw,20px);letter-spacing:12px;font-weight:900;
  text-shadow:0 0 12px rgba(255,0,0,.7);margin:0 0 26px;white-space:nowrap}
.barframe{position:relative;z-index:1;width:min(680px,86vw);height:42px;box-sizing:border-box;padding:6px;margin:0 0 10px;
  background:linear-gradient(#331018,#0d0407);border:4px solid #050102;border-radius:9px;
  box-shadow:inset 0 2px 8px #000,0 0 0 2px #6b1420,0 10px 34px rgba(0,0,0,.85);overflow:hidden}
.bar{width:0%;height:100%;border-radius:4px;position:relative;overflow:hidden;transition:width .12s linear;
  background:linear-gradient(180deg,#ff9a9a 0%,#ff3b3b 45%,#9b0000 100%);
  box-shadow:0 0 18px rgba(255,40,40,.85),inset 0 2px 3px rgba(255,255,255,.55)}
.stripes{position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.3) 0 16px,rgba(255,255,255,0) 16px 32px);
  animation:stripes .55s linear infinite}
@keyframes stripes{from{background-position:0 0}to{background-position:45px 0}}
.stats{position:relative;z-index:1;width:min(680px,86vw);display:flex;justify-content:space-between;color:#ffdede;
  font-size:clamp(12px,1.7vw,17px);font-weight:800;letter-spacing:1px;text-shadow:0 2px 4px #000,0 0 12px rgba(255,0,0,.6);margin:0 0 12px}
.hint{position:relative;z-index:1;color:#a06a6a;font:700 13px system-ui,sans-serif;letter-spacing:3px;margin:0;white-space:nowrap}
.err{color:#ff8a8a;font:700 14px system-ui,sans-serif}
</style>
<script src="TemplateData/UnityProgress.js"></script>
<script src="Build/UnityLoader.js"></script>
</head>
<body>
<div id="loading-text" class="load">
  <div class="glow"></div>
  <div class="gtitle">GRANNY</div>
  <div class="gsub">A HORROR EXPERIENCE</div>
  <div class="barframe"><div class="bar" id="g-bar"><div class="stripes"></div></div></div>
  <div class="stats"><span id="g-mb">0.00 MB / 567.86 MB</span><span id="g-pct">0.0%</span></div>
  <div class="hint" id="g-hint">LOADING THE HOUSE…</div>
</div>
<div id="unityContainer"></div>
<script>
(function(){
  var bar=document.getElementById('g-bar'), mb=document.getElementById('g-mb'),
      pct=document.getElementById('g-pct'), hint=document.getElementById('g-hint');
  var TOTAL_PARTS=29, TOTAL_MB=567.86, done=0;
  function show(){
    var f=Math.min(1,done/TOTAL_PARTS);
    bar.style.width=(f*100).toFixed(2)+'%';
    mb.textContent=(f*TOTAL_MB).toFixed(2)+' MB / '+TOTAL_MB.toFixed(2)+' MB';
    pct.textContent=(f*100).toFixed(1)+'%';
  }
  function fetchWithTimeout(url,ms){
    var ctl=new AbortController(), t=setTimeout(function(){ctl.abort()},ms);
    return fetch(url,{signal:ctl.signal,cache:'force-cache'}).then(function(r){
      clearTimeout(t);
      if(!r.ok) throw new Error('HTTP '+r.status+' '+url);
      return r.arrayBuffer();
    }).catch(function(e){clearTimeout(t);throw e});
  }
  async function getPart(i){
    var url='Build/GrannyPortButBetter.data.unityweb.part'+i;
    for(var attempt=1;attempt<=4;attempt++){
      try{ return new Uint8Array(await fetchWithTimeout(url,45000)); }
      catch(e){ if(attempt===4) throw new Error('part '+i+' failed: '+(e&&e.message)); }
    }
  }
  async function run(){
    try{
      var buffers=new Array(TOTAL_PARTS);
      var next=0;
      async function worker(){
        while(true){
          var i=next++; if(i>=TOTAL_PARTS) return;
          buffers[i]=await getPart(i+1);
          done++; show();
        }
      }
      await Promise.all([worker(),worker(),worker(),worker()]);
      var total=buffers.reduce(function(s,a){return s+a.length},0);
      var merged=new Uint8Array(total), off=0;
      buffers.forEach(function(b){merged.set(b,off);off+=b.length});
      var blobUrl=URL.createObjectURL(new Blob([merged]));
      var origOpen=XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open=function(m,u){
        if(String(u).indexOf('GrannyPortButBetter.data.unityweb')!==-1) u=blobUrl;
        return origOpen.call(this,m,u,arguments[2],arguments[3],arguments[4]);
      };
      hint.textContent='STARTING THE NIGHTMARE…';
      UnityLoader.instantiate('unityContainer','Build/GrannyPortButBetter.json',{onProgress:UnityProgress});
      var l=document.getElementById('loading-text'); if(l) l.remove();
    }catch(e){
      hint.className='err';
      hint.textContent='LOAD FAILED: '+(e&&e.message?e.message:e);
    }
  }
  show(); run();
})();
</script>
</body>
</html>
