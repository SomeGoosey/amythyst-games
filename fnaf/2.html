<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Five Nights at Freddy's 2</title>
<base href="/fnaf/2/">
<link rel="stylesheet" type="text/css" href="style.css">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<style>html,body{border:0!important;border-radius:0!important;box-shadow:none!important;margin:0;padding:0;overflow:hidden;background:#000}canvas{border:0!important;border-radius:0!important;box-shadow:none!important;outline:0!important}</style>
</head>
<body>
<div style="display:inline-block;-webkit-user-select:none;text-align:left">
  <canvas id="MMFCanvas" width="1280" height="720">Your browser does not support Canvas.</canvas>
</div>
<div id="progress-container">
  <div style="margin-bottom:6px">Downloading... <span id="download-text">0%</span></div>
  <div style="width:100%;background:#444;border-radius:6px;overflow:hidden"><div id="download-bar" style="height:10px;background:#3b82f6;width:0%;transition:width .2s"></div></div>
  <div style="margin:12px 0 6px">Extracting... <span id="extract-text">0%</span></div>
  <div style="width:100%;background:#444;border-radius:6px;overflow:hidden"><div id="extract-bar" style="height:10px;background:#10b981;width:0%;transition:width .2s"></div></div>
</div>
<script src="/fnaf/jszip.min.js"></script>
<script src="main.js"></script>
</body>
</html>
