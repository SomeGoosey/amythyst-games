<!DOCTYPE html>
<html lang="en-us">
<head>
<base href="https://cdn.jsdelivr.net/gh/SomeGoosey/amythyst-games@v1.0.65/space-waves-v2/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Space Waves</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#13141E;border:0!important;border-radius:0!important;box-shadow:none!important}
#unity-canvas{position:fixed;top:0;left:0;width:100%;height:100%;outline:none;border:0!important;border-radius:0!important;box-shadow:none!important}
#loading-text{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;font:800 clamp(20px,4vw,42px) "Arial Black",Impact,sans-serif;letter-spacing:3px;background:radial-gradient(ellipse at 50% 35%,#241a4a 0%,#0a0814 75%);text-shadow:0 0 18px rgba(120,90,255,.8)}
#loading-text .bar{width:min(560px,84vw);height:26px;border:3px solid #05030d;border-radius:6px;background:#181232;box-shadow:inset 0 2px 6px #000,0 0 0 2px #4b3a8f;overflow:hidden}
#loading-text .fill{height:100%;width:0;background:linear-gradient(90deg,#6f5cff,#b39cff,#fff);box-shadow:0 0 16px #8f7cff;transition:width .15s linear}
#loading-text .sub{font-size:14px;letter-spacing:5px;color:#b7a8ff}
</style>
</head>
<body>
<div id="loading-text"><div>SPACE WAVES</div><div class="bar"><div class="fill" id="lf"></div></div><div class="sub" id="lt">LOADING ASSETS…</div></div>
<canvas id="unity-canvas"></canvas>
<script>
const SPLIT_MAP = {"9adf8a1aafea4c2333e26d66a8b36d56.wasm": null};
async function mergeParts(baseUrl) {
  const parts = [];
  for (let i = 1; i <= 99; i++) {
    const testUrl = baseUrl + ".part" + i;
    try { const head = await fetch(testUrl, { method: "HEAD" }); if (!head.ok) break; parts.push(testUrl); }
    catch { break; }
  }
  if (parts.length === 0) return baseUrl;
  const buffers = await Promise.all(parts.map(async u => { const r = await fetch(u); if (!r.ok) throw new Error("Failed part " + u); return new Uint8Array(await r.arrayBuffer()); }));
  const total = buffers.reduce((a,b)=>a+b.length,0), merged = new Uint8Array(total); let off=0;
  for (const b of buffers) { merged.set(b, off); off += b.length; }
  return URL.createObjectURL(new Blob([merged]));
}
(async () => {
  const map = {}, files = Object.entries(SPLIT_MAP); let done=0;
  const fill=document.getElementById('lf'), txt=document.getElementById('lt'), totalBytes=45900000; let loaded=0;
  for (const [file,_] of files) {
    map[file] = await mergeParts("Build/"+file); done++;
    fill.style.width=Math.floor(done/files.length*100)+'%';
    txt.textContent='LOADING… '+Math.floor(done/files.length*100)+'%';
  }
  const origFetch=window.fetch;
  window.fetch=async function(resource,options){
    if(typeof resource==="string"){
      const key=resource.split("/").pop();
      if(map[key]) return origFetch(map[key],options);
    }
    return origFetch(resource,options);
  };
  const OrigXHR=window.XMLHttpRequest;
  window.XMLHttpRequest=function(){
    const xhr=new OrigXHR(), origOpen=xhr.open;
    xhr.open=function(method,url,...rest){ const key=String(url).split("/").pop(); if(map[key]) url=map[key]; return origOpen.call(xhr,method,url,...rest); };
    return xhr;
  };
  const canvas=document.getElementById("unity-canvas");
  const config={dataUrl:"Build/e4aa851098e3e5d328e4d879078ad6c5.data",frameworkUrl:"Build/f3dc87e8bc321dd382fbd3fa53e1091f.framework.js",codeUrl:"Build/9adf8a1aafea4c2333e26d66a8b36d56.wasm",streamingAssetsUrl:"https://cdn.jsdelivr.net/gh/SomeGoosey/amythyst-games@v1.0.68/space-waves-v2/StreamingAssets",companyName:"Space Waves",productName:"Space Waves",productVersion:"1.0.0"};
  const script=document.createElement("script"); script.src="Build/81bbae32c7a77bc49304934b19e72883.loader.js";
  script.onload=()=>{
    createUnityInstance(canvas,config,(p)=>{fill.style.width=Math.round(p*100)+'%';txt.textContent='STARTING… '+Math.round(p*100)+'%';})
      .then(i=>{window.gameInstance=i;var l=document.getElementById('loading-text');if(l)l.remove();})
      .catch(e=>{txt.textContent='ERROR '+String(e);});
  };
  document.body.appendChild(script);
})();
function resizeCanvas(){var c=document.getElementById("unity-canvas");c.width=window.innerWidth;c.height=window.innerHeight;c.style.width=window.innerWidth+"px";c.style.height=window.innerHeight+"px";}
window.addEventListener("load",resizeCanvas);window.addEventListener("resize",resizeCanvas);resizeCanvas();
</script>
</body>
</html>
